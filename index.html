  ['worth','Net Worth Tracker','chart','Track assets, liabilities, and snapshots.'],
  ['wishlist','Wishlist','bag','Plan purchases and monitor savings.'],
  ['challenges','Savings Challenges','spark','Log savings challenges and track streaks.'],
  ['kanban','Financial Goals Kanban','grid','Organize financial goals on a movable board.']]],
 ['Advanced review',[
  ['analytics','Advanced Analytics','chart','See historical patterns across your finances.'],
  ['reports','Financial Reports','note','Review and print reports for custom date ranges.'],
  ['health','Financial Health','heart','Review a transparent monthly planning score.'],
  ['journal','Money Wellness Journal','note','Keep a private record of financial reflections.'],
  ['backup','Premium Backup & Restore','note','Download and restore planner data.'],
  ['personalization','Advanced Personalization','settings','Customize formatting, appearance, and audio controls.']]]
];
const locked=Object.fromEntries(lockedGroups.flatMap(([,items])=>items.map(([key,name,glyph,info])=>[key,{name,info,glyph}])));
const groups=[
 ['Demo planner',[['dashboard','Dashboard','home'],['transactions','Transactions','arrows'],['budget','Monthly Budget','grid'],['savings','Savings Goals','target']]],
 ...lockedGroups.map(([label,items])=>[label,items.map(([key,name,glyph])=>[key,name,glyph,true]),label==='Advanced tracking']),
 ['Preferences',[['settings','Settings','settings'],['help','Help & about','help']]]
];
const titles={dashboard:'Dashboard',transactions:'Transactions',budget:'Monthly Budget',savings:'Savings Goals',settings:'Settings',help:'Help & about'};
const categories={income:['Salary','Freelance','Other income'],expense:['Housing','Groceries','Dining','Transport','Utilities','Shopping','Entertainment','Other']};
const key=APP_KEY+'.records';
function starter(withExamples){
  const month=monthOf(today());
  const row=(name,amount,category,type,day)=>({id:id(),name,amount,category,type,date:month+'-'+String(day).padStart(2,'0')});
  return {version:1,examples:withExamples,month,transactions:withExamples?[
    row('Studio payroll',460000,'Salary','income',1),row('Freelance project',80000,'Freelance','income',12),
    row('Apartment rent',136000,'Housing','expense',3),row('Corner Market',48650,'Groceries','expense',11),
    row('Morning Coffee',14450,'Dining','expense',13),row('Transit pass',22500,'Transport','expense',9),
    row('Electric & internet',18700,'Utilities','expense',14),row('Sunday Studio',15400,'Shopping','expense',15)
  ]:[],budget:withExamples?[{category:'Housing',amount:140000},{category:'Groceries',amount:59000},{category:'Dining',amount:24000}]:[],
  goal:withExamples?{name:'Coastal vacation',target:250000,starting:125000,contributions:[]}:null};
}
const saved=getLocal(key,null);
let state=saved?.version===1&&Array.isArray(saved.transactions)&&saved.transactions.length<=15&&Array.isArray(saved.budget)&&saved.budget.length<=3?saved:starter(true);
let storageProblem=!saved&&!setLocal(key,state);
prefs.currency='USD';period=state.month;
function commit(edit,message='Saved.'){
  const next=structuredClone(state);edit(next);state=next;
  storageProblem=!setLocal(key,state);render();notify(storageProblem?'Changes are only in memory.':message);
}
function pageReset(){}
const periodRows=()=>state.transactions.filter(row=>monthOf(row.date)===period);
const demoTotals=()=>{
  const list=periodRows(),income=sum(list,x=>x.type==='income'?x.amount:0),expense=sum(list,x=>x.type==='expense'?x.amount:0);
  return {list,income,expense};
};
const totalFor=(list,category)=>sum(list,x=>x.type==='expense'&&x.category===category?x.amount:0);
const gSaved=goal=>goal.starting+sum(goal.contributions,x=>x.amount);
const usd=amount=>h(money(amount));
const renderCategory=(kind)=>categories[kind].map(c=>[c,c]);
function positive(raw){const value=toMinor(raw);if(value<=0)throw new Error(t('Enter an amount greater than zero.'));return value;}
const transactionSearchContext=entry=>t(entry.category);
function openTransaction(existing=null,preferred='expense',date=today()){
  if(!existing&&state.transactions.length>=15){modal('Demo limit reached','<p>'+tt('The demo allows 15 saved transactions. Delete one before adding another.')+'</p>');return;}
  const row=existing||{type:preferred,date,amount:'',name:'',category:categories[preferred]?.[0]||'Other'};
  const type=['expense','income'].includes(row.type)?row.type:'expense';
  formModal(existing?'Edit transaction':'Add transaction',[
    choose('type','Type',type,[['income','Income'],['expense','Expense']]),dateField('date','Date',row.date),textField('name','Description',row.name),
    amountField('amount','Amount',row.amount),choose('category','Category',row.category,renderCategory(type),'required')
  ],form=>{
    const name=form.name.trim(), amount=positive(form.amount);
    if(!name)throw new Error(t('Enter a name.'));
    if(!validDate(form.date))throw new Error(t('Enter a valid date.'));
    if(!categories[form.type]?.includes(form.category))throw new Error(t('Choose a matching category.'));
    if(!existing&&state.transactions.length>=15)throw new Error(t('The demo allows 15 saved transactions. Delete one before adding another.'));
    const entry={id:existing?.id||id(),date:form.date,type:form.type,name,amount,category:form.category};
    commit(next=>{const index=next.transactions.findIndex(x=>x.id===entry.id);if(index<0)next.transactions.push(entry);else next.transactions[index]=entry;},'Transaction saved.');
  });
  const form=$('#editor');
  form.elements.type.addEventListener('change',()=>form.elements.category.replaceChildren(...categories[form.elements.type.value].map(name=>new Option(t(name),name))));
}
function editBudget(existing=''){
  if(!existing&&state.budget.length>=3){modal('Demo limit reached','<p>'+tt('The demo budget allows up to three categories.')+'</p>');return;}
  if(state.budget.length&&period!==state.month){modal('One demo budget','<p>'+tt('Review or edit your existing budget in its original month.')+'</p>'+btn('Open budget month','budget-month'));return;}
  const row=state.budget.find(x=>x.category===existing),choices=categories.expense.filter(c=>c===existing||!state.budget.some(x=>x.category===c));
  formModal(existing?'Edit category limit':'Add category limit',[choose('category','Category',existing||choices[0],choices.map(c=>[c,c])),amountField('amount','Planned amount',row?.amount??'')],form=>{
    const amount=positive(form.amount);
    if(!choices.includes(form.category)||(!existing&&state.budget.length>=3))throw new Error(t('The demo budget allows up to three categories.'));
    commit(next=>{if(!next.budget.length)next.month=period;next.budget=next.budget.filter(x=>x.category!==existing);next.budget.push({category:form.category,amount});});
  });
}
function editGoal(){
  const goal=state.goal;
  formModal(goal?'Edit savings goal':'Add savings goal',[textField('name','Name',goal?.name),amountField('target','Target amount',goal?.target??''),amountField('starting','Starting amount',goal?.starting??0)],form=>{
    const name=form.name.trim();if(!name)throw new Error(t('Enter a name.'));
    const target=positive(form.target),starting=toMinor(form.starting||'0');
    commit(next=>{next.goal={name,target,starting,contributions:goal?.contributions||[]};});
  });
}
function addContribution(){
  if(!state.goal)return;
  formModal('Add contribution',[amountField('amount','Amount'),dateField('date','Date')],form=>{
    const amount=positive(form.amount);if(!validDate(form.date))throw new Error(t('Enter a valid date.'));
    commit(next=>next.goal.contributions.push({id:id(),amount,date:form.date}),'Contribution saved.');
  });
}
function recentRows(rows){
  return [...rows].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(x=>'<div class="row"><div class="row-label"><span class="row-icon">'+icon(x.type==='income'?'up':'bag')+'</span><div><strong>'+h(x.name)+'</strong><br><small>'+tt(x.category)+' · '+h(dateText(x.date))+'</small></div></div><strong class="money '+(x.type==='income'?'positive':'negative')+'">'+txSign(x.type)+usd(x.amount)+'</strong></div>').join('');
}
function dash(){
  const {list,income,expense}=demoTotals(), limits=period===state.month?state.budget:[],planned=sum(limits,x=>x.amount);
  const spent=sum(limits,x=>totalFor(list,x.category)), goal=state.goal, values=categories.expense.map(c=>[t(c),totalFor(list,c)]);
  return hero(t('Your finance overview'), 'Track income, expenses, and a monthly budget.', 'dashboard',
    btn('Add income','add-tx','data-type="income"','','up')+btn('Add expense','add-tx','data-type="expense"','','down'),true)+
    grid(kpi('Monthly income',income,'main','up'),kpi('Monthly expenses',expense,'rose','down'),kpi('Remaining budget',planned-spent,'gold','grid'),kpi('Left to spend',income-expense,'mint','wallet'))+
    grid(card('Spending by category',donut(values),7,'','Selected month'),card('Budget progress','<strong>'+usd(spent)+' / '+usd(planned)+'</strong>'+progress(spent,planned)+(limits.length?limits.map(x=>'<div class="row"><strong>'+tt(x.category)+'</strong>'+usd(x.amount-totalFor(list,x.category))+'</div>').join(''):empty('Set your first category limit.')),5,link('budget','Budget','grid','pill')),
    card('Recent transactions',recentRows(list)||empty('Your posted transactions will appear here.'),7,link('transactions','View all','arrows','pill')),
    card('Savings Goals',goal?'<strong>'+h(goal.name)+'</strong><p>'+usd(gSaved(goal))+' / '+usd(goal.target)+'</p>'+progress(gSaved(goal),goal.target):empty('Set a goal and start tracking your progress.'),5,link('savings','Savings Goals','target','pill')));
}
function ledger(){
  const rows=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date));
  return grid(card('Transactions',rows.length?table(['Date','Description','Category','Amount','Actions'],rows.map(x=>[
    h(dateText(x.date)),h(x.name)+'<br><small>'+tt(x.type==='income'?'Income':'Expense')+'</small>',tt(x.category),'<strong class="money">'+txSign(x.type)+usd(x.amount)+'</strong>',
    '<div class="actions">'+btn('Edit','edit-tx',actionAttrs('transactions',x.id))+btn('Delete','remove-tx',actionAttrs('transactions',x.id),'danger')+'</div>'
  ])):empty('Your posted transactions will appear here.'),12,btn('Add transaction','add-tx','','primary','plus'),rows.length+' / 15 '+t('saved transactions')));
}
function budget(){
  if(period!==state.month&&state.budget.length)return grid(card('One demo budget',empty('Review or edit your existing budget in its original month.',btn('Open budget month','budget-month'))));
  const list=periodRows(), rows=state.budget;
  return grid(card(monthText(period),rows.length?table(['Category','Planned','Spent','Remaining','Actions'],rows.map(x=>{
    const spent=totalFor(list,x.category);
    return [tt(x.category),usd(x.amount),usd(spent),usd(x.amount-spent)+progress(spent,x.amount),'<div class="actions">'+btn('Edit','budget-edit',actionAttrs(x.category))+btn('Delete','budget-delete',actionAttrs(x.category),'danger')+'</div>'];
  })):empty('Set your first category limit.'),12,btn('Add category limit','budget-add','','primary','plus'),rows.length+' / 3 '+t('categories')));
}
function savings(){
  const goal=state.goal;
  return grid(card('Savings Goals',goal?'<h3>'+h(goal.name)+'</h3><p>'+usd(gSaved(goal))+' / '+usd(goal.target)+'</p>'+progress(gSaved(goal),goal.target)+'<div class="actions">'+btn('Add contribution','contribution','','primary')+btn('Edit','goal')+btn('Delete','goal-delete','','danger')+'</div>':empty('Set a goal and start tracking your progress.',btn('Add savings goal','goal','','primary','plus')),8),
  card('Contributions',goal?.contributions.length?table(['Date','Amount','Actions'],goal.contributions.map(x=>[h(dateText(x.date)),usd(x.amount),btn('Delete','contribution-delete',actionAttrs('goal',x.id),'danger')])):empty('No contributions recorded.'),4));
}
function applySettings(update){savePrefs(update);}
function settings(){
  return settingsGrid(card('Personalization',preferenceForm(basicPrefs()),8),card('Local data','<p>'+tt('Demo records are stored in this browser.')+'</p><div class="actions">'+btn('Clear demo data','clear','','danger')+'</div>',4));
}
function help(){
  return grid(card('About this planner','<p>'+tt('Ultimate Budget Planner is a manual, offline finance workspace by WellKept Tools.')+'</p><p>'+tt('The demo includes 15 transactions, three categories in one monthly budget, and one savings goal.')+'</p><p>'+tt('Use Alt+N to add a transaction, Alt+H to open the dashboard, and Escape to close dialogs.')+'</p>'));
}
const views={dashboard:dash,transactions:ledger,budget,savings,settings,help};
function render(){
  if(!Object.hasOwn(views,route))route='dashboard';
  document.title=t(titles[route])+' · Ultimate Budget Planner';
  navigation(groups);header(titles[route]);
  const subtitle=({transactions:'Add and edit up to 15 saved transactions.',budget:'Plan one month with up to three categories.',savings:'Track contributions to one savings goal.',settings:'Choose your theme, language, and display options.',help:'Make the most of your offline planner.'})[route];
  const bannerMessages=['Try up to 15 transactions, one monthly budget, and one savings goal.'];
  if(state.examples)bannerMessages.push('The demo includes editable example records.');
  $('#content').innerHTML=editionBanner('Demo edition',bannerMessages,'spark')+(storageProblem?'<div class="notice">'+tt('Browser storage could not be read or saved.')+'</div>':'')+
   (route==='dashboard'?'':hero(t(titles[route]),subtitle,route))+views[route]();
  runCounts();
}
function appAction(action,data){
  const row=state.transactions.find(x=>x.id===data.id);
  if(action==='locked'){
    const item=locked[data.key];if(item)modal(item.name,'<div class="row"><span class="row-icon">'+icon('lock')+'</span><strong>'+tt('Available in the full version')+'</strong></div><p>'+tt(item.info)+'</p>');
  }else if(action==='edit-tx'&&row)openTransaction(row);
  else if(action==='remove-tx'&&row)confirmAction('Delete transaction?','This record will be removed from the planner.',()=>commit(next=>{next.transactions=next.transactions.filter(x=>x.id!==row.id);},'Record deleted.'));
  else if(action==='budget-add'||action==='budget-edit')editBudget(action==='budget-edit'?data.key:'');
  else if(action==='budget-delete')confirmAction('Delete category limit?','This record will be removed from the planner.',()=>commit(next=>{next.budget=next.budget.filter(x=>x.category!==data.key);},'Record deleted.'));
  else if(action==='budget-month'){if($('#dialog').open)$('#dialog').close();setPeriod(state.month);}
  else if(action==='goal')editGoal();
  else if(action==='contribution')addContribution();
  else if(action==='goal-delete')confirmAction('Delete savings goal?','The goal and its contributions will be removed.',()=>commit(next=>{next.goal=null;},'Record deleted.'));
  else if(action==='contribution-delete')confirmAction('Delete contribution?','This record will be removed from the planner.',()=>commit(next=>{next.goal.contributions=next.goal.contributions.filter(x=>x.id!==data.id);},'Record deleted.'));
  else if(action==='clear')confirmAction('Clear demo data?','This removes all saved demo records.',()=>{period=monthOf(today());commit(next=>Object.assign(next,starter(false)),'Demo data cleared.');});
}
applyPrefs();route=location.hash.slice(1)||'dashboard';drawer(false);render();

})();
</script></body></html>
